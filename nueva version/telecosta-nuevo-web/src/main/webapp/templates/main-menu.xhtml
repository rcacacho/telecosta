<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui">

    <h:form id="frm_menu">
        <p:menubar autoDisplay="false" style="width: 100%; font-size: small;">

            <p:submenu label="Clientes" icon="pi pi-users" rendered="#{loginMB.validarRol().equals('cobros') || loginMB.validarRoot()}">
                <p:menuitem value="Lista" outcome="/clientes/lista.xhtml"/>
                <p:menuitem value="Registro" outcome="/clientes/registro.xhtml"/>
            </p:submenu>

            <p:submenu label="Pagos" icon="pi pi-wallet" rendered="#{loginMB.validarRol().equals('cobros') || loginMB.validarRoot()}">
                <p:menuitem value="Lista" outcome="/pagos/lista.xhtml"/>
                <p:menuitem value="Registro" outcome="/pagos/registro.xhtml"/>
                <p:menuitem value="Registro Múltiple" outcome="/pagos/registroMultiple.xhtml"/>
            </p:submenu>

            <p:submenu label="Cobros" icon="pi pi-dollar" rendered="#{loginMB.validarRol().equals('cobros') || loginMB.validarRoot()}">
                <p:menuitem value="Lista" outcome="/cobros/lista.xhtml"/>
                <p:menuitem value="Registro" outcome="/cobros/registro.xhtml"/>
                <p:menuitem value="Registro Múltiple" outcome="/cobros/registroMultiple.xhtml"/>
            </p:submenu>

            <p:submenu label="Caja Agencias" icon="pi pi-inbox" rendered="#{loginMB.validarRol().equals('cobros') || loginMB.validarRoot()}">
                <p:menuitem value="Lista" outcome="/caja/lista.xhtml"/>
                <p:menuitem value="Registro" outcome="/caja/registro.xhtml"/>
                <p:menuitem value="Cuadre" outcome="/caja/cuadre.xhtml"/>
                <p:menuitem value="Reporte" outcome="/caja/reporte.xhtml"/>
            </p:submenu>

            <p:submenu label="Usuarios Sistema" icon="pi pi-user" rendered="#{loginMB.validarRoot()}">
                <p:menuitem value="Lista" outcome="/usuario/lista.xhtml"/>
                <p:menuitem value="Registro" outcome="/usuario/registro.xhtml"/>
            </p:submenu>

            <p:submenu label="Reportes" icon="pi pi-chart-bar">
                <p:menuitem value="Reporte" outcome="/reportes/reporte.xhtml"/>
                <p:menuitem value="Cobros" outcome="/reportes/cobros.xhtml"/>
            </p:submenu>

            <p:submenu label="Configuración" icon="pi pi-cog" rendered="#{loginMB.validarRol().equals('contabilidad') || loginMB.validarRol().equals('bodega_central') || loginMB.validarRoot()}">
                <p:menuitem value="Configuración pago" outcome="/configuracion/lista.xhtml" rendered="#{loginMB.validarRol().equals('contabilidad') || loginMB.validarRoot()}"/>
                <p:menuitem value="Configuración compra" outcome="/configuracion/compra/lista.xhtml" rendered="#{loginMB.validarRol().equals('contabilidad') || loginMB.validarRoot()}"/>
                <p:menuitem value="Insumos" outcome="/configuracion/insumos/lista.xhtml" rendered="#{loginMB.validarRol().equals('bodega_central') || loginMB.validarRoot()}"/>
            </p:submenu>

            <p:submenu label="Compras" icon="pi pi-shopping-cart" rendered="#{loginMB.validarRol().equals('contabilidad') || loginMB.validarRoot()}">
                <p:menuitem value="Lista" outcome="/compras/lista.xhtml"/>
                <p:menuitem value="Registro" outcome="/compras/registro.xhtml"/>
                <p:menuitem value="Reporte" outcome="/compras/reporte.xhtml"/>
            </p:submenu>

            <p:submenu label="Bodega" icon="pi pi-box" rendered="#{loginMB.validarRol().equals('bodega_central') || loginMB.validarRoot()}">
                <p:menuitem value="Ingresos" outcome="/inventario/ingreso.xhtml"/>
                <p:menuitem value="Salidas" outcome="/inventario/salidas.xhtml"/>
                <p:menuitem value="Traslados" outcome="/inventario/traslados.xhtml"/>
                <p:menuitem value="Técnicos" outcome="/inventario/tecnicos.xhtml"/>
                <p:menuitem value="Reporte" outcome="/inventario/reporte.xhtml"/>
            </p:submenu>

            <p:submenu label="Compras Bodega" icon="pi pi-shopping-bag" rendered="#{loginMB.validarRol().equals('bodega_central') || loginMB.validarRoot()}">
                <p:menuitem value="Lista" outcome="/compras-bodega/lista.xhtml"/>
                <p:menuitem value="Registro" outcome="/compras-bodega/registro.xhtml"/>
                <p:menuitem value="Reporte" outcome="/compras-bodega/reporte.xhtml"/>
            </p:submenu>

            <p:submenu label="Ticket de trabajo" icon="pi pi-ticket" rendered="#{loginMB.validarRol().equals('bodega_central') || loginMB.validarRoot() || loginMB.validarRol().equals('cobros')}">
                <p:menuitem value="Lista" outcome="/atencion/lista.xhtml"/>
                <p:menuitem value="Registro" outcome="/atencion/registro.xhtml"/>
                <p:menuitem value="Reporte" outcome="/atencion/reporte.xhtml"/>
            </p:submenu>

        </p:menubar>
    </h:form>
</ui:composition>
